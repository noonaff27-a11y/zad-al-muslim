<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبر معلوماتك | زاد المسلم</title><link rel="stylesheet" href="style.css"></head><body>
<header class="reader-top"><a href="index.html">← المكتبة</a><b>❓ اختبر معلوماتك</b><a href="leaderboard.html">🏆 المتفوقون</a></header>
<main class="quiz-wrap"><div id="setup" class="quiz-card"><span class="eyebrow">تحدي القصص</span><h1>اختبر معلوماتك</h1><p>اكتب اسمك ثم أجب عن أسئلة عشوائية.</p><input id="playerName" placeholder="اسم الطفل"><select id="quizStory"><option value="all">كل القصص</option></select><button class="btn" id="start">ابدأ الاختبار</button></div>
<div id="game" class="quiz-card hidden"><div class="quiz-meta"><span id="qnum"></span><span id="score"></span></div><h2 id="question"></h2><input id="answer" placeholder="اكتب إجابتك هنا"><button class="btn" id="check">تحقق من الإجابة</button><div id="feedback"></div><button class="btn ghost hidden" id="nextQ">السؤال التالي</button></div>
<div id="result" class="quiz-card hidden"></div></main><script src="quiz.js"></script></body></html>
